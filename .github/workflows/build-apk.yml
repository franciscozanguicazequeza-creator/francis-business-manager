name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar projecto
        run: |
          mkdir projecto
          unzip -q *.zip -d projecto

      - name: Compilar APK
        run: |
          cd projecto/FrancisBusinessManagerAndroid
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Francis-Business-Manager
          path: projecto/FrancisBusinessManagerAndroid/app/build/outputs/apk/debug/app-debug.apk
